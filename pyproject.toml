[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "baul-rm"
version = "10.2.0"
description = "Lokale, inkrementelle Pipeline fuer die Schallmessungs-Auswertung"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scipy>=1.12"
]

[project.optional-dependencies]
audio = ["panns-inference>=0.1.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
